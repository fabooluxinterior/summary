<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faboolux Project Summary Generator</title>
    
    <link rel="icon" type="image/webp" href="https://faboolux.com/wp-content/uploads/2022/03/logo-1536x921-1.webp">
    
    <!-- EXCEL PARSER ENGINE -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0b0c10;
            --card-bg: #141519;
            --card-border: #26272c;
            --brand-orange: #e85d22;
            --text-main: #ffffff;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 0 20px 40px;
            box-sizing: border-box;
            color: var(--text-main);
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; }
            100% { opacity: 0.6; }
        }

        .top-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 1400px;
            padding: 30px 0;
            margin-bottom: 20px;
        }

        .brand-logo {
            height: 80px;
            width: auto;
            object-fit: contain;
        }

        .container {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 40px;
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 100%;
            max-width: 650px;
            animation: fadeIn 0.5s ease forwards;
            position: relative;
            overflow: hidden;
            margin-top: 30px;
        }
        
        .preview-container {
            max-width: 1200px;
            padding: 40px;
            margin-top: 20px;
            display: none;
        }

        .brand-badge {
            display: inline-block;
            background: #1a1a1a;
            border: 1px solid #333;
            color: var(--brand-orange);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h3 { margin-top: 0; color: #ffffff; font-weight: 600; }

        .action-button {
            background: #ffffff;
            color: #000000;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-family: inherit;
            border: none;
            margin: 10px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .action-button:hover { background: #e2e8f0; }
        
        .upload-area {
            border: 2px dashed #444;
            padding: 50px 20px;
            border-radius: 16px;
            margin: 25px 0;
            background: #0d0e11;
            transition: all 0.3s ease;
        }
        .upload-area:hover { border-color: var(--brand-orange); }
        
        input[type="file"] { display: none; }
        
        .file-label {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.2s;
        }
        .file-label:hover { background: #e2e8f0; }

        .back-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            transition: color 0.2s;
            padding: 10px;
        }
        .back-btn:hover:not(:disabled) { color: #ffffff; }

        .spinner {
            display: none;
            width: 24px;
            height: 24px;
            border: 3px solid #333;
            border-top: 3px solid var(--brand-orange);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px auto;
        }
        
        @keyframes spin { 100% { transform: rotate(360deg); } }

        #status-container { margin-top: 20px; min-height: 40px; }
        #status { font-size: 15px; font-weight: 500; }
        .loading-text { animation: pulse 1.5s infinite; color: var(--brand-orange) !important;}

        .tables-wrapper {
            max-height: 70vh;
            overflow-y: auto;
            padding-right: 10px;
            margin-bottom: 20px;
        }
        .tables-wrapper::-webkit-scrollbar { width: 8px; }
        .tables-wrapper::-webkit-scrollbar-track { background: #111; border-radius: 10px; }
        .tables-wrapper::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* STRICTLY PLAIN & STRAIGHT EDGES */
        .pdf-preview-table {
            background-color: #ffffff !important;
            color: #000000 !important;
            padding: 0 !important;
            border-radius: 0 !important; /* Removes curves */
            box-shadow: none !important;
            border: none !important; /* Rely entirely on the table's borders to prevent edge breaking */
            overflow: visible !important;
        }
        
        .pdf-preview-table * {
            color: #000000;
        }

        .manual-input {
            border: 1px dashed var(--brand-orange);
            background: rgba(255,255,255,0.05);
            padding: 6px;
            min-width: 50px;
            transition: 0.2s;
            border-radius: 0;
            outline: none;
        }
        
        .manual-input:focus {
            border-style: solid;
            background: rgba(255,255,255,0.08);
        }

        @media print {
            @page { size: A4 portrait; margin: 8mm; }
            body { background: #ffffff !important; padding: 0; margin: 0; align-items: flex-start; color: #000000 !important; }
            body * { visibility: hidden; }
            #preview-page, #preview-page * { visibility: visible; color: #000000 !important; }
            #preview-page { position: absolute; left: 0; top: 0; width: 100%; max-width: 100%; box-shadow: none; padding: 0; margin: 0; background: #ffffff !important; border: none !important; border-radius: 0 !important; }
            .no-print, .tables-wrapper::-webkit-scrollbar { display: none !important; }
            .tables-wrapper { max-height: none; overflow: visible; padding: 0; margin: 0;}
            
            table { border-collapse: collapse; font-size: 10pt !important; width: 100%; border: 1px solid #000 !important; }
            thead { display: table-header-group; }
            tbody { display: table-row-group; page-break-inside: avoid; }
            tr { page-break-inside: avoid; }
            th, td { border: 1px solid #000000 !important; padding: 8px 10px !important; color: #000000 !important; vertical-align: middle !important; background-color: #ffffff !important; }
            
            .manual-input { border: none !important; padding: 0 !important; background: transparent !important; min-width: auto !important; display: inline !important;}
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION -->
    <header class="top-nav">
        <img src="https://faboolux.com/wp-content/uploads/2022/03/logo-1536x921-1.webp" alt="Faboolux Logo" class="brand-logo">
    </header>

    <!-- UPLOAD INTERFACE -->
    <div id="upload-page" class="container">
        <div class="brand-badge">Summary Generator</div>
        <h3 style="margin-bottom: 5px; font-size: 24px;">Upload Estimate</h3>
        <p style="color: var(--text-muted); font-size: 15px; margin-top: 5px;">Select your Fabsketch Excel file to generate the project summary.</p>
        
        <div class="upload-area">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="1.5" style="margin-bottom: 15px;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
            <br>
            <label class="file-label">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
                Choose .xlsx File
                <input type="file" accept=".xlsx, .xls" onchange="handleFileUpload(event)">
            </label>
        </div>

        <div id="status-container">
            <div class="spinner" id="spinner"></div>
            <div id="status"></div>
        </div>
    </div>

    <!-- PREVIEW & PRINT PAGE -->
    <div id="preview-page" class="container preview-container">
        <div class="no-print" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="text-align: left;">
                <div class="brand-badge" style="margin-bottom: 10px; border-color: var(--success); color: var(--success);">Success</div>
                <h2 style="margin: 0; font-size: 28px; color: white;">Project Summary</h2>
            </div>
            <div>
                <button class="action-button" onclick="window.print()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                    Print PDF
                </button>
            </div>
        </div>
        <div class="tables-wrapper" id="tables-container"></div>
        <div class="no-print" style="margin-top: 20px;">
            <button class="back-btn" onclick="showUploadPage()">← Process Another File</button>
        </div>
    </div>

    <script>
        function showUploadPage() {
            document.getElementById('preview-page').style.display = 'none';
            document.getElementById('upload-page').style.display = 'block';
            document.getElementById('status').innerText = '';
            document.getElementById('file-input').value = '';
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            const statusEl = document.getElementById('status'), spinner = document.getElementById('spinner');
            spinner.style.display = 'block'; 
            statusEl.innerText = 'Extracting data...'; 
            statusEl.className = 'loading-text'; 

            const reader = new FileReader();
            reader.onload = function(e) { 
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, {type: 'array'});
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const parsedDataMatrix = XLSX.utils.sheet_to_json(worksheet, {header: 1, defval: ""});
                    
                    statusEl.innerText = 'Formatting and displaying...'; 
                    
                    spinner.style.display = 'none'; 
                    statusEl.className = ''; 
                    statusEl.style.color = 'var(--success)'; 
                    statusEl.innerText = '✅ Summary generated successfully'; 
                    showPreviewPage(parsedDataMatrix);
                } catch(error) {
                    spinner.style.display = 'none'; 
                    statusEl.className = ''; 
                    statusEl.style.color = 'var(--danger)'; 
                    statusEl.innerText = `❌ Error: Unreadable file format.`;
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function showPreviewPage(dataRows) {
            document.getElementById('upload-page').style.display = 'none';
            
            const container = document.getElementById('tables-container');
            container.innerHTML = ''; 

            if (!Array.isArray(dataRows) || dataRows.length === 0) {
                document.getElementById('upload-page').style.display = 'block';
                document.getElementById('status').style.color = 'var(--danger)';
                document.getElementById('status').innerText = '❌ No items were found to extract.';
                return;
            }

            let rooms = {};
            let currentRoom = 'UNNAMED';
            let currentSection = 'Modular';
            let currentCategory = 'General';

            const extractNum = (arr) => {
                let val = parseFloat(String(arr[15] || '').replace(/,/g, ''));
                if (!isNaN(val) && val !== 0) return val;
                let rev = arr.slice().reverse();
                for (let x of rev) {
                    let parsed = parseFloat(String(x).replace(/,/g, ''));
                    if (!isNaN(parsed) && parsed !== 0) return parsed;
                }
                return 0;
            };

            let finalSellingPrice = 0;
            let finalDiscountLabel = "DISCOUNT";
            let finalDiscountValue = 0;
            let finalSpecialDiscountValue = 0;
            let hasSpecialDiscount = false;
            let finalGrandTotal = 0;

            let customerName = "Insert Customer Name";
            let projectId = "Untitled";
            let estDate = new Date().toLocaleDateString('en-GB'); 

            dataRows.forEach((row, index) => {
                if (!row || row.length === 0) return;
                
                let colA = String(row[0] || '').trim();
                let colALower = colA.toLowerCase();
                let joinedRow = row.join(" ").toLowerCase();

                if (index < 30) {
                    for (let j = 0; j < row.length; j++) {
                        let cellStr = String(row[j]).trim().toLowerCase();
                        if (cellStr === "project id") projectId = String(row[j+1] || row[j+2] || "").trim();
                        if (cellStr === "customer name" || cellStr === "client name") {
                            let val = String(row[j+1] || row[j+2] || "").trim();
                            if (val) customerName = val;
                        }
                        if (cellStr === "date" && estDate === new Date().toLocaleDateString('en-GB')) {
                            let dVal = String(row[j+1] || row[j+2] || "").trim();
                            if (dVal && !dVal.includes('valid')) estDate = dVal;
                        }
                    }
                }

                if (joinedRow.includes('selling price')) { finalSellingPrice = extractNum(row); return; }
                if (joinedRow.includes('special discount')) { hasSpecialDiscount = true; finalSpecialDiscountValue = extractNum(row); return; }
                if (joinedRow.includes('discount')) { finalDiscountLabel = colA || row.find(x => String(x).toLowerCase().includes('discount')) || "DISCOUNT"; finalDiscountValue = extractNum(row); return; }
                if (joinedRow.includes('grand total')) { finalGrandTotal = extractNum(row); return; }

                if (colALower === 'accessories') { currentSection = 'Accessories'; return; }
                if (colALower === 'others') { currentSection = 'Others'; return; }
                if (colALower === 'carcass finish' || colALower === 'shutters' || colALower === 'modular') { currentSection = 'Modular'; return; }

                if (colA !== '' && !/^\d+$/.test(colA) && colALower !== 'sl no' && colA.length > 2 && !colALower.includes("inclusive") && !colALower.includes("above price") && !colALower.includes("terms") && !colALower.includes("estimate for")) {
                    currentRoom = colA.toUpperCase();
                    currentSection = 'Modular';
                    currentCategory = 'General';
                    return;
                }

                if (row.length < 15) return;
                
                let itemName = String(row[1] || '').trim();
                let priceVal = parseFloat(String(row[15] || '').replace(/,/g, '')) || extractNum(row);

                if (itemName && !isNaN(priceVal) && priceVal > 0 && itemName.toLowerCase() !== 'item') {
                    if (!rooms[currentRoom]) {
                        rooms[currentRoom] = { categories: {}, Accessories: 0, Others: 0 };
                    }

                    if (currentSection === 'Accessories') {
                        rooms[currentRoom].Accessories += priceVal;
                    } else if (currentSection === 'Others') {
                        rooms[currentRoom].Others += priceVal;
                    } else {
                        let nameLower = itemName.toLowerCase();
                        let itemCategory = 'General';

                        if (nameLower.includes('aristo') || nameLower.includes('slide line 18') || nameLower.includes('slidline')) itemCategory = 'Wardrobe';
                        else if (nameLower.includes('wardrobe loft')) itemCategory = 'Wardrobe';
                        else if (nameLower.includes('study loft')) itemCategory = 'Study';
                        else if (nameLower.includes('crockery loft') || nameLower.replace(/\s/g, '').includes('crockeryloft') || nameLower.includes('corckery loft')) itemCategory = 'Crockery';
                        else if (nameLower.includes('loft')) itemCategory = 'Loft';
                        else if (nameLower.includes('tv') || nameLower.includes('t v')) itemCategory = 'TV Unit';
                        else if (nameLower.includes('crockery') || nameLower.includes('corckery')) itemCategory = 'Crockery';
                        else if (nameLower.includes('prayer') || nameLower.includes('pooja')) itemCategory = 'Prayer';
                        else if (nameLower.includes('wardrobe') || nameLower.includes('closet')) itemCategory = 'Wardrobe';
                        else if (nameLower.includes('shoe rack') || nameLower.replace(/\s/g, '').includes('shoerack')) itemCategory = 'Shoe Rack';
                        else if (nameLower.includes('kitchen')) itemCategory = 'Kitchen';
                        else if (nameLower.includes('bedside') || nameLower.includes('bed side')) itemCategory = 'Bedside';
                        else if (nameLower.includes('headboard')) itemCategory = 'Headboard';
                        else if (nameLower.includes('cot') || nameLower.includes('bed')) itemCategory = 'Cot';
                        else if (nameLower.includes('study')) itemCategory = 'Study';
                        else if (nameLower.includes('vanity')) itemCategory = 'Vanity';
                        else if (nameLower.includes('dresser')) itemCategory = 'Dresser';
                        else if (nameLower.includes('bay window') || nameLower.replace(/\s/g, '').includes('baywindow')) itemCategory = 'Bay Window';
                        else if (nameLower.includes('partition')) itemCategory = 'Partition';

                        if (!rooms[currentRoom].categories[itemCategory]) {
                            rooms[currentRoom].categories[itemCategory] = 0;
                        }
                        rooms[currentRoom].categories[itemCategory] += priceVal;
                    }
                }
            });

            let timestamp = new Date().toLocaleString('en-IN', { dateStyle: 'short', timeStyle: 'short' });
            
            // Added explicit borders to the table tag to prevent breaks
            let tableHTML = `<div class="pdf-preview-table fade-in">
                <table class="summary-table" style="width: 100%; border-collapse: collapse; font-family: 'Outfit', Arial, sans-serif; font-size: 12px; color: #000000; text-align: left; background-color: #ffffff !important; border: 1px solid #000;">
                <thead>
                    <tr>
                        <th colspan="6" style="border: 1px solid #000; padding: 15px; text-align: center; font-size: 18px; color: #334155 !important; background-color: #f8fafc !important; letter-spacing: 1px; text-transform: uppercase;">FABOOLUX INTERIORS</th>
                    </tr>
                    <tr>
                        <th style="border: 1px solid #000; padding: 12px; color: #334155 !important; background-color: #f8fafc !important; text-transform: uppercase; width: 15%;">CUSTOMER NAME</th>
                        <td colspan="2" style="border: 1px solid #000; padding: 12px; width: 35%; font-weight: 500; background-color: #ffffff !important; color: #000 !important;">
                            <div contenteditable="true" class="manual-input" style="min-width: 150px; font-weight: bold; border-color: #cbd5e1; outline: none; border-style: dashed; padding: 4px;">${customerName}</div>
                        </td>
                        <th style="border: 1px solid #000; padding: 12px; color: #334155 !important; background-color: #f8fafc !important; text-transform: uppercase; width: 15%;">DATE</th>
                        <td style="border: 1px solid #000; padding: 12px; width: 15%; font-weight: 500; background-color: #ffffff !important; color: #000 !important;">${estDate}</td>
                        <td rowspan="2" style="border: 1px solid #000; padding: 10px; text-align: center; width: 20%; vertical-align: middle; background-color: #ffffff !important;">
                            <img src="https://faboolux.com/wp-content/uploads/2022/03/logo-1536x921-1.webp" style="max-width: 120px; height: auto;">
                        </td>
                    </tr>
                    <tr>
                        <th style="border: 1px solid #000; padding: 12px; color: #334155 !important; background-color: #f8fafc !important; text-transform: uppercase;">PROJECT ID</th>
                        <td colspan="2" style="border: 1px solid #000; padding: 12px; font-weight: 500; background-color: #ffffff !important; color: #000 !important;">${projectId}</td>
                        <th style="border: 1px solid #000; padding: 12px; color: #334155 !important; background-color: #f8fafc !important; text-transform: uppercase;">REPORT GENERATED</th>
                        <td style="border: 1px solid #000; padding: 12px; font-weight: 500; background-color: #ffffff !important; color: #000 !important;">${timestamp}</td>
                    </tr>
                    <tr>
                        <th colspan="6" style="border: 1px solid #000; padding: 12px; text-align: center; font-size: 15px; background-color: #e2e8f0 !important; color: #334155 !important; text-transform: uppercase;">PROJECT TOTAL SUMMARY</th>
                    </tr>
                    <tr>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 20%;">ROOM NAME</th>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 20%;">CATEGORY</th>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 15%;">MODULAR PRICE</th>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 15%;">ACCESSORIES PRICE</th>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 15%;">OTHERS PRICE</th>
                        <th style="border: 1px solid #000; padding: 12px; text-align: center; background-color: #f1f5f9 !important; color: #334155 !important; text-transform: uppercase; width: 15%;">TOTAL AMOUNT</th>
                    </tr>
                </thead>`;

            let sortedRoomKeys = Object.keys(rooms).sort();

            if (sortedRoomKeys.length === 0) {
                tableHTML += `<tbody><tr><td colspan="6" style="text-align: center; padding: 20px; color: #000 !important; background-color: #ffffff !important; border: 1px solid #000;">No priced items found in the estimate.</td></tr></tbody>`;
            }

            sortedRoomKeys.forEach(roomName => {
                let roomObj = rooms[roomName];
                let categories = Object.keys(roomObj.categories).sort();
                
                if (categories.length === 0) {
                    if (roomObj.Accessories > 0 || roomObj.Others > 0) {
                        categories = ['GENERAL'];
                        roomObj.categories['GENERAL'] = 0;
                    } else {
                        return;
                    }
                }

                let catCount = categories.length;
                let roomModularTotal = 0;
                categories.forEach(c => roomModularTotal += roomObj.categories[c]);
                
                let roomTotal = roomModularTotal + roomObj.Accessories + roomObj.Others;
                if (roomTotal <= 0) return; 

                tableHTML += `<tbody style="page-break-inside: avoid; background-color: #ffffff !important;">`;

                categories.forEach((cat, index) => {
                    let modPrice = roomObj.categories[cat] || 0;

                    tableHTML += `<tr style="background-color: #ffffff !important;">`;
                    
                    if (index === 0) {
                        tableHTML += `<td rowspan="${catCount}" style="border: 1px solid #000; padding: 12px; font-weight: bold; color: #000 !important; text-transform: uppercase; vertical-align: middle; text-align: center; background-color: #ffffff !important;">${roomName}</td>`;
                    }
                    
                    tableHTML += `<td style="border: 1px solid #000; padding: 12px; color: #000 !important; font-weight: 500; background-color: #ffffff !important;">${cat}</td>`;
                    tableHTML += `<td style="border: 1px solid #000; padding: 12px; text-align: right; color: #000 !important; background-color: #ffffff !important;">${modPrice > 0 ? modPrice.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0.00'}</td>`;
                    
                    if (index === 0) {
                        tableHTML += `<td rowspan="${catCount}" style="border: 1px solid #000; padding: 12px; text-align: right; vertical-align: middle; color: #000 !important; background-color: #ffffff !important;">${roomObj.Accessories > 0 ? roomObj.Accessories.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0.00'}</td>`;
                        tableHTML += `<td rowspan="${catCount}" style="border: 1px solid #000; padding: 12px; text-align: right; vertical-align: middle; color: #000 !important; background-color: #ffffff !important;">${roomObj.Others > 0 ? roomObj.Others.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2}) : '0.00'}</td>`;
                        tableHTML += `<td rowspan="${catCount}" style="border: 1px solid #000; padding: 12px; text-align: right; vertical-align: middle; font-weight: bold; color: #000 !important; background-color: #ffffff !important;">${roomTotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>`;
                    }
                    tableHTML += `</tr>`;
                });

                tableHTML += `</tbody>`;
            });

            tableHTML += `<tbody style="page-break-inside: avoid; background-color: #ffffff !important;">`;
            
            let formattedSellingPrice = finalSellingPrice.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            let formattedDiscount = finalDiscountValue.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            let formattedGrandTotal = finalGrandTotal.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            tableHTML += `<tr>
                    <th colspan="5" style="border: 1px solid #000; padding: 12px; text-align: right; color: #334155 !important; background-color: #ffffff !important; text-transform: uppercase;">SELLING PRICE</th>
                    <th style="border: 1px solid #000; padding: 12px; text-align: right; color: #000 !important; background-color: #ffffff !important;">${formattedSellingPrice}</th>
                </tr>`;

            if (finalDiscountValue > 0) {
                tableHTML += `<tr>
                    <th colspan="5" style="border: 1px solid #000; padding: 12px; text-align: right; color: #334155 !important; background-color: #ffffff !important; text-transform: uppercase;">${finalDiscountLabel}</th>
                    <th style="border: 1px solid #000; padding: 12px; text-align: right; color: #000 !important; background-color: #ffffff !important;">${formattedDiscount}</th>
                </tr>`;
            }

            if (hasSpecialDiscount) {
                let formattedSpecial = finalSpecialDiscountValue.toLocaleString('en-IN', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                tableHTML += `<tr>
                    <th colspan="5" style="border: 1px solid #000; padding: 12px; text-align: right; color: #334155 !important; background-color: #ffffff !important; text-transform: uppercase;">SPECIAL DISCOUNT</th>
                    <th style="border: 1px solid #000; padding: 12px; text-align: right; color: #000 !important; background-color: #ffffff !important;">${formattedSpecial}</th>
                </tr>`;
            }

            tableHTML += `<tr>
                    <th colspan="5" style="border: 1px solid #000; padding: 16px 15px; text-align: right; background-color: #e2e8f0 !important; color: #334155 !important; font-size: 14px; text-transform: uppercase;">GRAND TOTAL (INCLUDING GST)</th>
                    <th style="border: 1px solid #000; padding: 16px 15px; text-align: right; background-color: #e2e8f0 !important; color: #000 !important; font-size: 15px; font-weight: bold;">${formattedGrandTotal}</th>
                </tr>`;

            tableHTML += `</tbody></table></div>`;
            
            container.innerHTML += tableHTML;
            document.getElementById('preview-page').style.display = 'block';
        }
    </script>
</body>
</html>
